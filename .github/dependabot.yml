version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      test-tooling:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]
    # ODM stays on .NET 10 (LTS, supported until November 2028). Packages that follow the .NET major version only get
    # patch and minor updates; the move to the next LTS (.NET 12) is done by hand together with the Docker images and CI.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    # Major versions of the toolchain are upgraded by hand: svelte-check only supports certain TypeScript versions,
    # @types/node must match the Node version of the Docker image and CI.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # Only LTS versions are used: Node (even numbers) and .NET 10 (see nuget above). Major versions are changed by hand
    # together with CI (and @types/node for Node).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
