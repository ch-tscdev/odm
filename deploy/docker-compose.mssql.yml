# SQL Server instead of PostgreSQL: an addition to docker-compose.yml, like the HTTPS variant.
# Select it in .env:  COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.mssql.yml
# (with HTTPS:        COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.https.yml:deploy/docker-compose.mssql.yml)
# Requires Docker Compose 2.24.4 or newer (uses "!override"). ODM_DB_PASSWORD needs upper and lower case letters and digits
# (SQL Server policy) and must not contain ';'. For an external SQL Server set ODM_DB_CONNECTION instead.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: !override
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ODM_DB_PASSWORD:?set ODM_DB_PASSWORD in .env}
    volumes: !override
      - odm-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  odm:
    environment:
      Database__Provider: SqlServer
      # In production use a dedicated account instead of 'sa' (ODM_DB_CONNECTION, see docs/operations.md).
      Database__ConnectionString: ${ODM_DB_CONNECTION:-Server=db;Database=odm;User Id=sa;Password=${ODM_DB_PASSWORD};TrustServerCertificate=True}

volumes:
  odm-mssql:
