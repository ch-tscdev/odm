services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: odm
      POSTGRES_USER: odm
      POSTGRES_PASSWORD: ${ODM_DB_PASSWORD:?set ODM_DB_PASSWORD in .env}
    volumes:
      - odm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odm -d odm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible package store (RustFS). For another S3 service set ODM_S3_URL etc. in .env; this one then stays unused.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: odm
      RUSTFS_SECRET_KEY: ${ODM_S3_PASSWORD:?set ODM_S3_PASSWORD in .env (at least 8 characters)}
    volumes:
      - odm-packages:/data

  odm:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    ports:
      - "${ODM_BIND:-0.0.0.0}:${ODM_PORT:-8080}:8080"
      # HTTPS directly at ODM, only used when ODM_TLS_CERT is set
      - "${ODM_BIND:-0.0.0.0}:${ODM_TLS_PORT:-8443}:8443"
    volumes:
      - odm-pki:/pki
      - ./certs:/certs:ro
    # Every setting comes from .env; see .env.example. Do not edit this file.
    environment:
      # Database (bundled PostgreSQL unless ODM_DB_CONNECTION points elsewhere)
      Database__Provider: Postgres
      Database__ConnectionString: ${ODM_DB_CONNECTION:-Host=db;Database=odm;Username=odm;Password=${ODM_DB_PASSWORD}}
      # Package store (bundled RustFS unless ODM_S3_URL points elsewhere)
      Storage__S3__ServiceUrl: ${ODM_S3_URL:-http://s3:9000}
      Storage__S3__Region: ${ODM_S3_REGION:-us-east-1}
      Storage__S3__Bucket: ${ODM_S3_BUCKET:-odm-packages}
      Storage__S3__AccessKey: ${ODM_S3_ACCESS_KEY:-odm}
      Storage__S3__SecretKey: ${ODM_S3_SECRET_KEY:-${ODM_S3_PASSWORD}}
      Storage__S3__ForcePathStyle: ${ODM_S3_PATH_STYLE:-true}
      Secrets__MasterKey: ${ODM_SECRETS_KEY:?set ODM_SECRETS_KEY in .env (openssl rand -base64 32)}
      # Sign-in
      Jwt__Secret: ${ODM_JWT_SECRET:?set ODM_JWT_SECRET in .env}
      Jwt__ExpiryMinutes: ${ODM_SESSION_MINUTES:-60}
      Identity__BootstrapAdmin__UserName: ${ODM_ADMIN_USER:-admin}
      Identity__BootstrapAdmin__Password: ${ODM_ADMIN_PASSWORD:?set ODM_ADMIN_PASSWORD in .env}
      Identity__Ldap__Enabled: ${ODM_LDAP_ENABLED:-false}
      Identity__Ldap__Host: ${ODM_LDAP_HOST:-}
      Identity__Ldap__Port: ${ODM_LDAP_PORT:-636}
      Identity__Ldap__Security: ${ODM_LDAP_SECURITY:-Ldaps}
      Identity__Ldap__BaseDn: ${ODM_LDAP_BASE_DN:-}
      Identity__Ldap__BindDn: ${ODM_LDAP_BIND_DN:-}
      Identity__Ldap__BindPassword: ${ODM_LDAP_BIND_PASSWORD:-}
      Identity__Ldap__UserFilter: ${ODM_LDAP_USER_FILTER:-(sAMAccountName={0})}
      Identity__Ldap__DisplayNameAttribute: ${ODM_LDAP_DISPLAY_NAME_ATTRIBUTE:-displayName}
      Identity__Ldap__GroupAttribute: ${ODM_LDAP_GROUP_ATTRIBUTE:-memberOf}
      Identity__Ldap__AdminGroup: ${ODM_LDAP_ADMIN_GROUP:-}
      Identity__Ldap__OperatorGroup: ${ODM_LDAP_OPERATOR_GROUP:-}
      Identity__Ldap__ReadOnlyGroup: ${ODM_LDAP_READONLY_GROUP:-}
      Identity__Oidc__PublicBaseUrl: ${ODM_OIDC_PUBLIC_URL:-${ODM_PUBLIC_URL:-}}
      Identity__Oidc__Providers__0__Id: ${ODM_OIDC_ID:-}
      Identity__Oidc__Providers__0__DisplayName: ${ODM_OIDC_DISPLAY_NAME:-}
      Identity__Oidc__Providers__0__Authority: ${ODM_OIDC_AUTHORITY:-}
      Identity__Oidc__Providers__0__ClientId: ${ODM_OIDC_CLIENT_ID:-}
      Identity__Oidc__Providers__0__ClientSecret: ${ODM_OIDC_CLIENT_SECRET:-}
      Identity__Oidc__Providers__0__Scopes__0: ${ODM_OIDC_SCOPES:-}
      Identity__Oidc__Providers__0__UserNameClaim: ${ODM_OIDC_USERNAME_CLAIM:-preferred_username}
      Identity__Oidc__Providers__0__DisplayNameClaim: ${ODM_OIDC_DISPLAY_NAME_CLAIM:-name}
      Identity__Oidc__Providers__0__GroupsClaim: ${ODM_OIDC_GROUPS_CLAIM:-groups}
      Identity__Oidc__Providers__0__AdminValues__0: ${ODM_OIDC_ADMIN_VALUES:-}
      Identity__Oidc__Providers__0__OperatorValues__0: ${ODM_OIDC_OPERATOR_VALUES:-}
      Identity__Oidc__Providers__0__ReadOnlyValues__0: ${ODM_OIDC_READONLY_VALUES:-}
      # Reverse proxy and direct HTTPS
      Proxy__ForwardedHeaders: ${ODM_PROXY_FORWARDED_HEADERS:-false}
      Proxy__TrustedProxies__0: ${ODM_TRUSTED_PROXY:-}
      Proxy__TrustAllProxies: ${ODM_PROXY_TRUST_ALL:-false}
      Tls__CertificateFile: ${ODM_TLS_CERT:+/certs/${ODM_TLS_CERT}}
      Tls__KeyFile: ${ODM_TLS_KEY:+/certs/${ODM_TLS_KEY}}
      # Agents
      Agents__PublicBaseUrl: ${ODM_PUBLIC_URL:-}
      Agents__HeartbeatSeconds: ${ODM_AGENT_HEARTBEAT_SECONDS:-60}
      Agents__Update__Mode: ${ODM_AGENT_UPDATE_MODE:-Off}
      Agents__Update__TargetVersion: ${ODM_AGENT_UPDATE_VERSION:-}
      Agents__Update__RolloutPercent: ${ODM_AGENT_UPDATE_PERCENT:-100}
      Agents__Mtls__Mode: ${ODM_MTLS_MODE:-Off}
      Agents__Mtls__CaDirectory: /pki
      Agents__Mtls__CertificateValidityDays: ${ODM_MTLS_CERT_DAYS:-365}
      Agents__Mtls__RenewBeforeDays: ${ODM_MTLS_RENEW_DAYS:-30}
      Agents__Mtls__ForwardedCertificateHeader: ${ODM_MTLS_FORWARDED_HEADER:-}
      # Software distribution and OS updates
      Software__MaxPackageMegabytes: ${ODM_MAX_PACKAGE_MB:-4096}
      Software__ReconcileSeconds: ${ODM_RECONCILE_SECONDS:-60}
      Software__RepoRefreshHours: ${ODM_REPO_REFRESH_HOURS:-24}
      OsUpdates__CheckSeconds: ${ODM_OS_UPDATE_CHECK_SECONDS:-60}
      # Notifications
      Notifications__Enabled: ${ODM_NOTIFY_ENABLED:-false}
      Notifications__CheckMinutes: ${ODM_NOTIFY_CHECK_MINUTES:-5}
      Notifications__Events__0: ${ODM_NOTIFY_EVENTS:-}
      Notifications__SilentHours: ${ODM_NOTIFY_SILENT_HOURS:-24}
      Notifications__CertificateDays: ${ODM_NOTIFY_CERT_DAYS:-7}
      Notifications__MaxPerMessage: ${ODM_NOTIFY_MAX_PER_MESSAGE:-50}
      Notifications__Email__Host: ${ODM_SMTP_HOST:-}
      Notifications__Email__Port: ${ODM_SMTP_PORT:-587}
      Notifications__Email__Security: ${ODM_SMTP_SECURITY:-StartTls}
      Notifications__Email__UserName: ${ODM_SMTP_USER:-}
      Notifications__Email__Password: ${ODM_SMTP_PASSWORD:-}
      Notifications__Email__From: ${ODM_SMTP_FROM:-}
      Notifications__Email__To__0: ${ODM_SMTP_TO:-}
      Notifications__Webhook__Url: ${ODM_WEBHOOK_URL:-}
      Notifications__Webhook__Authorization: ${ODM_WEBHOOK_AUTHORIZATION:-}
      # Retention in days (0 = keep forever)
      Agents__JobRetentionDays: ${ODM_RETENTION_JOBS_DAYS:-90}
      Agents__TokenRetentionDays: ${ODM_RETENTION_TOKENS_DAYS:-30}
      OsUpdates__RunRetentionDays: ${ODM_RETENTION_OS_UPDATES_DAYS:-365}
      Audit__RetentionDays: ${ODM_RETENTION_AUDIT_DAYS:-365}
      Notifications__RetentionDays: ${ODM_RETENTION_NOTIFICATIONS_DAYS:-180}
      # Logging: Trace | Debug | Information | Warning | Error
      Logging__LogLevel__Default: ${ODM_LOG_LEVEL:-Information}
      Logging__LogLevel__Odm: ${ODM_LOG_LEVEL_ODM:-Information}

volumes:
  odm-pki:
  odm-db:
  odm-packages:
